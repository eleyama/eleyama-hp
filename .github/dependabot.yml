version: 2
updates:
  # npmパッケージ（astro・wrangler と、それらが使うパッケージ）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # GitHub Actions（ci.yml で固定したSHAの更新）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
